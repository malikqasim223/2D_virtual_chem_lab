name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Analyze (Ignore Warnings/Infos)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Tests
        run: flutter test
      - name: Build Windows
        run: flutter build windows
